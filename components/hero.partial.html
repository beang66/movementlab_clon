<!-- ============================================
     HERO COMPONENT
     - 메인 히어로 캐러셀 배너 (Swiper)
     - 좌/우 네비게이션 화살표
     - 슬라이더 바 (진행률 + n/n 카운터)
     ※ 화살표·슬라이더 바는 히어로와 같은 영역이므로 별도 파일로
       분리하지 않고 이 컴포넌트 안에 함께 둡니다.
     ============================================ -->
    <section class="hero-section">
      <div class="mvl-container">
        <div class="swiper hero-swiper" id="heroSwiper">
          <ul class="swiper-wrapper">
            <li class="swiper-slide hero-slide">
              <a href="#">
                <a href="./product-concord.html" class="hero-product-link" aria-label="제품 상세페이지 보기"><img src="./img/banner_sd1.jpg" alt="타탄 소파" /></a>
                <div class="hero-caption">
                  <h2>덜어낸 깊이가 만드는 여백</h2>
                  <p>잭슨카멜레온 타탄 소파 · 새로운 코너 모듈</p>
                </div>
              </a>
            </li>
            <li class="swiper-slide hero-slide">
              <a href="#">
                <a href="./product-concord.html" class="hero-product-link" aria-label="제품 상세페이지 보기"><img src="./img/banner_sd2.jpg" alt="콤비 레더 소파" /></a>
                <div class="hero-caption">
                  <h2>완성도는 그대로, 선택의 폭은 넓게</h2>
                  <p>콤비 레더 소파 큐레이션</p>
                </div>
              </a>
            </li>

            <li class="swiper-slide hero-slide">
              <a href="#">
                <a href="./product-concord.html" class="hero-product-link" aria-label="제품 상세페이지 보기"><img src="./img/banner_sd3.jpg" alt="백화점 혜택" /></a>
                <div class="hero-caption">
                  <h2>롯데·신세계·현대백화점 전국 매장에서 만나는 특별한 혜택</h2>
                  <p>8월 31일까지 | 기간 한정 혜택</p>
                </div>
              </a>
            </li>

            <li class="swiper-slide hero-slide">
              <a href="#">
                <a href="./product-concord.html" class="hero-product-link" aria-label="제품 상세페이지 보기"><img src="./img/banner_sd4.jpg" alt="콘코드 소파" /></a>
                <div class="hero-caption">
                  <h2>서로 다른 소재가 빚어낸 깊이</h2>
                  <p>바이헤이데이 콘코드 소파</p>
                </div>
              </a>
            </li>
          </ul>

          <!-- 이전/다음 네비게이션 화살표 -->
          <button
            type="button"
            class="hero-nav prev"
            aria-label="이전 슬라이드"
          >
            <svg
              width="18"
              height="18"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                d="M11 4.5 6.5 9 11 13.5"
              ></path>
            </svg>
          </button>
          <button
            type="button"
            class="hero-nav next"
            aria-label="다음 슬라이드"
          >
            <svg
              width="18"
              height="18"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                d="M7 4.5 11.5 9 7 13.5"
              ></path>
            </svg>
          </button>

          <!-- 슬라이더 바: 진행률 + n/n 카운터 -->
          <div class="hero-slider-bar">
            <span class="hero-progress-track"
              ><span class="hero-progress-fill"></span
            ></span>
            <span class="hero-count"
              ><span class="hero-count-current">1</span> /
              <span class="hero-count-total">4</span></span
            >
          </div>
        </div>
      </div>
